services:
  teknovant:
    build: .
    container_name: teknovant-labs-taller
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      TEKNOVANT_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
