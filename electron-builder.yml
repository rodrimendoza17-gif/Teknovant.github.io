appId: com.teknovant.labs.taller
productName: Teknovant Labs Taller
copyright: Copyright © 2026 Teknovant Labs
asar: false
directories:
  output: release
files:
  - dist/**/*
  - dist-server/**/*
  - electron/**/*
  - public/**/*
  - package.json
  - .env.example
  - .env
win:
  icon: public/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Teknovant Labs Taller
portable:
  artifactName: Teknovant-Labs-Taller-Portable.exe
msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Teknovant Labs Taller
