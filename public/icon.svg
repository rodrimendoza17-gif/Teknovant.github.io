<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="40%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#070c1e"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with futuristic rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#cyberBg)" stroke="#1e293b" stroke-width="4"/>

  <!-- Futuristic tech grid circuit lines -->
  <path d="M 60 256 H 180 L 220 296 H 320" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.3"/>
  <path d="M 452 256 H 332 L 292 216 H 192" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.3"/>
  <circle cx="180" cy="256" r="4" fill="#00f2fe" opacity="0.6"/>
  <circle cx="332" cy="256" r="4" fill="#8b5cf6" opacity="0.6"/>

  <!-- Hexagonal Tech Shield Frame -->
  <polygon points="256,70 410,158 410,354 256,442 102,354 102,158" 
           fill="#0f172a" 
           stroke="url(#neonCyan)" 
           stroke-width="8" 
           filter="url(#neonGlow)"/>

  <!-- Inner Hexagon Accent -->
  <polygon points="256,92 390,168 390,344 256,420 122,344 122,168" 
           fill="none" 
           stroke="#1e293b" 
           stroke-width="2"/>

  <!-- Stylized Teknovant 'T' with circuit core -->
  <g filter="url(#neonGlow)">
    <!-- Top Bar of T -->
    <path d="M 160 160 H 352 L 328 200 H 184 Z" fill="url(#neonCyan)"/>
    <!-- Central Stem of T -->
    <path d="M 234 200 H 278 L 268 340 H 244 Z" fill="url(#neonCyan)"/>
    <!-- Cyber Core Diamond in Center -->
    <polygon points="256,236 280,260 256,284 232,260" fill="#00f2fe"/>
    <circle cx="256" cy="260" r="5" fill="#ffffff"/>
    
    <!-- Microchip and Lightning Accents -->
    <path d="M 256 340 L 256 380 L 272 388" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="272" cy="388" r="4" fill="#38bdf8"/>
    
    <!-- Energy Arcs -->
    <path d="M 160 240 Q 140 280 180 320" stroke="url(#neonViolet)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 352 240 Q 372 280 332 320" stroke="url(#neonCyan)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>
</svg>
